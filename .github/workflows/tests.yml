name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 为什么用 test:serial：默认并发下几条性能/进程归因用例（v3229 性能探针 5x 抖动、
      # v3241 夹具里真跑 run.mjs 的进程归因）在资源受限的 runner 上会随并发抖动而假红；
      # 干净检出上串行实测 299/299 · 3302 断言 · 0 失败。仓内本就提供该入口给受限环境。
      - name: Gate (npm run test:serial)
        run: npm run test:serial
