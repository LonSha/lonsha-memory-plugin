name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# one run per ref; a newer push cancels the older in-flight run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Gate (npm test)
        run: npm test
